<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myprompter</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }

  .hidden {
    display: none !important;
  }

  /* 編集画面 */
  #edit-screen {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 16px;
  }

  #edit-screen h1 {
    margin: 0 0 12px;
    font-size: 20px;
  }

  #script-input {
    flex: 1;
    width: 100%;
    font-size: 16px;
    line-height: 1.5;
    padding: 12px;
    resize: none;
  }

  #start-btn {
    margin-top: 12px;
    height: 64px;
    font-size: 20px;
    font-weight: bold;
  }

  #edit-note {
    margin-top: 8px;
    font-size: 12px;
    color: #666;
    text-align: center;
  }

  /* プロンプター画面 */
  #prompter-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }

  #back-btn {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 20;
    height: 44px;
    min-width: 44px;
    font-size: 20px;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    border: none;
    border-radius: 6px;
  }

  #scroll-container {
    overflow: hidden;
    height: 100%;
  }

  #script-content {
    color: #fff;
    font-size: 48px;
    line-height: 1.6;
    padding-left: 8%;
    padding-right: 8%;
    padding-top: 40vh;
    padding-bottom: 70vh;
  }

  #script-content .line.blank {
    height: 1.6em;
  }

  #empty-message {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    transform: translateY(-50%);
    color: #fff;
    font-size: 40px;
    text-align: center;
  }

  #countdown-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30vh;
    z-index: 10;
  }

  #pause-zone {
    position: absolute;
    top: 20%;
    left: 20%;
    width: 60%;
    height: 60%;
    z-index: 15;
  }

  #pause-indicator {
    position: absolute;
    bottom: 12px;
    right: 12px;
    z-index: 20;
    color: #fff;
    font-size: 14px;
    background: rgba(255, 255, 255, 0.15);
    padding: 6px 10px;
    border-radius: 6px;
  }

  /* 操作ボタン共通 */
  .ctrl-btn {
    min-width: 60px;
    min-height: 60px;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  #restart-btn {
    position: absolute;
    top: 64px;
    left: 12px;
    z-index: 20;
    font-size: 24px;
  }

  #speed-controls {
    position: absolute;
    top: 50%;
    right: 12px;
    transform: translateY(-50%);
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  #speed-value {
    min-width: 60px;
    text-align: center;
    color: #fff;
    font-size: 18px;
    user-select: none;
  }

  #nudge-controls {
    position: absolute;
    top: 50%;
    left: 12px;
    transform: translateY(-50%);
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
</style>
</head>
<body>

  <div id="edit-screen">
    <h1>myprompter</h1>
    <textarea id="script-input"></textarea>
    <button id="start-btn">スタート ▶</button>
    <p id="edit-note">録画中に画面が消える場合は、端末の自動ロック設定を長めにしてください</p>
  </div>

  <div id="prompter-screen" class="hidden">
    <button id="back-btn">←</button>
    <button id="restart-btn" class="ctrl-btn">⟲</button>
    <div id="speed-controls">
      <button id="speed-up" class="ctrl-btn">＋</button>
      <div id="speed-value">1.0x</div>
      <button id="speed-down" class="ctrl-btn">－</button>
    </div>
    <div id="nudge-controls">
      <button id="nudge-back" class="ctrl-btn">▲</button>
      <button id="nudge-forward" class="ctrl-btn">▼</button>
    </div>
    <div id="scroll-container">
      <div id="script-content"></div>
      <div id="empty-message" class="hidden">原稿を入力してください</div>
    </div>
    <div id="pause-zone"></div>
    <div id="pause-indicator" class="hidden">⏸ 一時停止中（タップで再開）</div>
    <div id="countdown-overlay" class="hidden"></div>
  </div>

<script>
  const DEFAULT_SCRIPT = `Hi, I'm Daisuke.
Welcome to Oku-Nikko.

I'm the founder of Sup! Sup!,
and I guide guests here in both English and Chinese.

One of my favorite ways to show you this area
is Paddle Boarding on Lake Chuzenji.

For me, Paddle Boarding is not just about being on the water.
It gives you a chance to slow down, look around,
and really feel the nature of Oku-Nikko.

While we paddle, I love sharing stories about
how this landscape was shaped by volcanic activity,
Also the local history and culture.

My goal is to help you enjoy the scenery,
but also understand why this place is so special.

I hope you leave Oku-Nikko
feeling a real connection to this place.`;

  const editScreen = document.getElementById('edit-screen');
  const prompterScreen = document.getElementById('prompter-screen');
  const scriptInput = document.getElementById('script-input');
  const startBtn = document.getElementById('start-btn');
  const backBtn = document.getElementById('back-btn');
  const scriptContent = document.getElementById('script-content');
  const emptyMessage = document.getElementById('empty-message');
  const countdownOverlay = document.getElementById('countdown-overlay');
  const scrollContainer = document.getElementById('scroll-container');
  const pauseZone = document.getElementById('pause-zone');
  const pauseIndicator = document.getElementById('pause-indicator');
  const restartBtn = document.getElementById('restart-btn');
  const speedUpBtn = document.getElementById('speed-up');
  const speedDownBtn = document.getElementById('speed-down');
  const speedValue = document.getElementById('speed-value');
  const nudgeBackBtn = document.getElementById('nudge-back');
  const nudgeForwardBtn = document.getElementById('nudge-forward');

  let countdownTimer = null;

  const state = { speed: 1.0, fontSize: 48, scrollY: 0, playing: false };

  scriptInput.value = DEFAULT_SCRIPT;

  function showPauseIndicator() { pauseIndicator.classList.remove('hidden'); }
  function hidePauseIndicator() { pauseIndicator.classList.add('hidden'); }

  let lastTs = null;
  function pxPerSec() { return (state.fontSize * 1.6 / 6) * state.speed; }
  function maxScroll() {
    return Math.max(0, scriptContent.scrollHeight - scrollContainer.clientHeight);
  }
  function tick(ts) {
    if (!state.playing) return;
    if (lastTs !== null) {
      state.scrollY = Math.min(state.scrollY + pxPerSec() * (ts - lastTs) / 1000, maxScroll());
      scriptContent.style.transform = `translateY(${-state.scrollY}px)`;
      if (state.scrollY >= maxScroll()) { pause(); showPauseIndicator(); }  // 末尾到達で自動停止
    }
    lastTs = ts;
    requestAnimationFrame(tick);
  }
  function play()  { if (state.playing) return; state.playing = true; lastTs = null; requestAnimationFrame(tick); }
  function pause() { state.playing = false; }
  function togglePlay() {
    if (countdownTimer !== null) return;  // カウントダウン中は無視（オーバーレイの裏で再生が始まるのを防ぐ）
    if (state.playing) { pause(); showPauseIndicator(); }
    else { play(); hidePauseIndicator(); }
  }
  function setSpeed(v) { state.speed = Math.min(3.0, Math.max(0.5, Math.round(v * 10) / 10)); }
  function updateSpeedDisplay() { speedValue.textContent = state.speed.toFixed(1) + 'x'; }
  function changeSpeed(delta) {  // setSpeedと表示更新をまとめて行う（キーボード操作もここを通す）
    setSpeed(state.speed + delta);
    updateSpeedDisplay();
  }
  function nudge(lines) {  // 戻る=負、進む=正。1行 = fontSize*1.6px
    state.scrollY = Math.min(maxScroll(), Math.max(0, state.scrollY + lines * state.fontSize * 1.6));
    scriptContent.style.transform = `translateY(${-state.scrollY}px)`;
  }
  function restart() {
    pause();
    hidePauseIndicator();
    state.scrollY = 0;
    scriptContent.style.transform = 'translateY(0)';
    startCountdown();
  }

  function showEdit() {
    pause();
    hidePauseIndicator();
    clearInterval(countdownTimer);
    countdownTimer = null;
    countdownOverlay.classList.add('hidden');
    prompterScreen.classList.add('hidden');
    editScreen.classList.remove('hidden');
  }

  function showPrompter() {
    state.scrollY = 0;
    scriptContent.style.transform = 'translateY(0)';
    editScreen.classList.add('hidden');
    prompterScreen.classList.remove('hidden');
  }

  function renderScript(text) {
    scriptContent.innerHTML = '';
    const lines = text.split('\n');
    lines.forEach(function (line) {
      const div = document.createElement('div');
      if (line.trim() === '') {
        div.className = 'line blank';
        div.innerHTML = '&nbsp;';
      } else {
        div.className = 'line';
        div.textContent = line;
      }
      scriptContent.appendChild(div);
    });
  }

  function startCountdown() {
    clearInterval(countdownTimer);
    const counts = ['3', '2', '1'];
    let i = 0;
    countdownOverlay.textContent = counts[i];
    countdownOverlay.classList.remove('hidden');
    countdownTimer = setInterval(function () {
      i++;
      if (i < counts.length) {
        countdownOverlay.textContent = counts[i];
      } else {
        clearInterval(countdownTimer);
        countdownTimer = null;
        countdownOverlay.classList.add('hidden');
        hidePauseIndicator();
        play();
      }
    }, 1000);
  }

  startBtn.addEventListener('click', function () {
    const text = scriptInput.value;
    showPrompter();
    if (text.trim() === '') {
      scriptContent.innerHTML = '';
      emptyMessage.classList.remove('hidden');
    } else {
      emptyMessage.classList.add('hidden');
      renderScript(text);
      startCountdown();
    }
  });

  backBtn.addEventListener('click', function () {
    showEdit();
  });

  pauseZone.addEventListener('click', function () {
    togglePlay();
  });

  restartBtn.addEventListener('click', function () {
    restart();
  });

  nudgeBackBtn.addEventListener('click', function () {
    nudge(-3);
  });

  nudgeForwardBtn.addEventListener('click', function () {
    nudge(3);
  });

  // 長押しで連続変化するボタンの共通処理（250ms後から100ms間隔でfnを繰り返す）
  function bindHoldRepeat(el, fn) {
    let holdTimeout = null;
    let holdInterval = null;
    function clearHold() {
      clearTimeout(holdTimeout);
      clearInterval(holdInterval);
      holdTimeout = null;
      holdInterval = null;
    }
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      fn();
      holdTimeout = setTimeout(function () {
        holdInterval = setInterval(fn, 100);
      }, 250);
    });
    el.addEventListener('pointerup', clearHold);
    el.addEventListener('pointerleave', clearHold);
    el.addEventListener('pointercancel', clearHold);
  }

  bindHoldRepeat(speedUpBtn, function () { changeSpeed(0.1); });
  bindHoldRepeat(speedDownBtn, function () { changeSpeed(-0.1); });

  document.addEventListener('keydown', function (e) {
    if (prompterScreen.classList.contains('hidden')) return;
    if (e.code === 'Space') {
      e.preventDefault();
      togglePlay();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      changeSpeed(0.1);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      changeSpeed(-0.1);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      restart();
    }
  });

  updateSpeedDisplay();
</script>

</body>
</html>
