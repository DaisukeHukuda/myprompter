<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myprompter</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }

  body {
    overscroll-behavior: none;
  }

  .hidden {
    display: none !important;
  }

  /* 編集画面 */
  #edit-screen {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 16px;
  }

  #edit-screen h1 {
    margin: 0 0 12px;
    font-size: 20px;
  }

  #script-input {
    flex: 1;
    width: 100%;
    font-size: 16px;
    line-height: 1.5;
    padding: 12px;
    resize: none;
  }

  #start-btn {
    margin-top: 12px;
    height: 64px;
    font-size: 20px;
    font-weight: bold;
  }

  #edit-note {
    margin-top: 8px;
    font-size: 12px;
    color: #666;
    text-align: center;
  }

  #font-size-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    font-size: 14px;
  }

  #font-size-input {
    flex: 1;
  }

  #font-size-value {
    min-width: 48px;
    text-align: right;
  }

  /* プロンプター画面 */
  #prompter-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #back-btn {
    /* 誤タップで録画中断になるため、あえて小さめ（計画の60px基準の意図的例外） */
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 20;
    height: 44px;
    min-width: 44px;
    font-size: 20px;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    border: none;
    border-radius: 6px;
  }

  #scroll-container {
    overflow: hidden;
    height: 100%;
  }

  #script-content {
    color: #fff;
    font-size: 48px;
    line-height: 1.3;
    padding-left: 8%;
    padding-right: 8%;
    padding-top: 40vh;
    padding-bottom: 70vh;
  }

  #script-content .line.blank {
    height: 0.3em;
    overflow: hidden;  /* &nbsp;1文字分の行高より低くするため、はみ出しを隠す */
  }

  #script-content .line {
    opacity: 0.75;
  }

  #script-content .line.current {
    opacity: 1;
    font-weight: 600;
  }

  #marker-line {
    position: absolute;
    top: 33%;
    left: 0;
    width: 100%;
    height: 2px;
    background: rgba(255, 255, 255, 0.35);
    pointer-events: none;
    z-index: 5;
  }

  #progress-display {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 5;
    color: #fff;
    font-size: 14px;
    opacity: 0.6;
    pointer-events: none;
  }

  #empty-message {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    transform: translateY(-50%);
    color: #fff;
    font-size: 40px;
    text-align: center;
  }

  #countdown-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30vh;
    z-index: 10;
  }

  #pause-zone {
    position: absolute;
    top: 20%;
    left: 20%;
    width: 60%;
    height: 60%;
    z-index: 15;
  }

  #pause-indicator {
    position: absolute;
    bottom: 12px;
    right: 12px;
    z-index: 20;
    color: #fff;
    font-size: 14px;
    background: rgba(255, 255, 255, 0.15);
    padding: 6px 10px;
    border-radius: 6px;
  }

  /* 操作ボタン共通 */
  .ctrl-btn {
    min-width: 60px;
    min-height: 60px;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  #restart-btn {
    position: absolute;
    top: 76px;
    left: 12px;
    z-index: 20;
    font-size: 24px;
  }

  #speed-controls {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 10px;
    width: min(60%, 640px);
  }

  #speed-slider {
    flex: 1;
    min-width: 80px;
    height: 44px;
    touch-action: none;  /* 親のtouch-action:noneの下でもスライダーのドラッグを成立させる */
    accent-color: #fff;
    margin: 0;
  }

  #speed-value {
    min-width: 60px;
    text-align: center;
    color: #fff;
    font-size: 18px;
    user-select: none;
  }

  #nudge-controls {
    position: absolute;
    top: 50%;
    left: 12px;
    transform: translateY(-50%);
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
</style>
</head>
<body>

  <div id="edit-screen">
    <h1>myprompter</h1>
    <textarea id="script-input"></textarea>
    <button id="start-btn">スタート ▶</button>
    <div id="font-size-row">
      <label for="font-size-input">文字サイズ</label>
      <input type="range" id="font-size-input" min="24" max="96" step="4" value="48">
      <span id="font-size-value">48px</span>
    </div>
    <p id="edit-note">録画中に画面が消える場合は、端末の自動ロック設定を長めにしてください</p>
  </div>

  <div id="prompter-screen" class="hidden">
    <button id="back-btn">←</button>
    <button id="restart-btn" class="ctrl-btn">⟲</button>
    <div id="speed-controls">
      <button id="speed-down" class="ctrl-btn">－</button>
      <input type="range" id="speed-slider" min="0.5" max="5" step="0.1" value="1">
      <button id="speed-up" class="ctrl-btn">＋</button>
      <div id="speed-value">1.0x</div>
    </div>
    <div id="nudge-controls">
      <button id="nudge-back" class="ctrl-btn">▲</button>
      <button id="nudge-forward" class="ctrl-btn">▼</button>
    </div>
    <div id="scroll-container">
      <div id="script-content"></div>
      <div id="empty-message" class="hidden">原稿を入力してください</div>
    </div>
    <div id="pause-zone"></div>
    <div id="marker-line"></div>
    <div id="progress-display"></div>
    <div id="pause-indicator" class="hidden">⏸ 一時停止中（タップで再開）</div>
    <div id="countdown-overlay" class="hidden"></div>
  </div>

<script>
  const DEFAULT_SCRIPT = `Hi, I'm Daisuke.
Welcome to Oku-Nikko.

I'm the founder of Sup! Sup!,
and I guide guests here in both English and Chinese.

One of my favorite ways to show you this area
is Paddle Boarding on Lake Chuzenji.

For me, Paddle Boarding is not just about being on the water.
It gives you a chance to slow down, look around,
and really feel the nature of Oku-Nikko.

While we paddle, I love sharing stories about
how this landscape was shaped by volcanic activity,
Also the local history and culture.

My goal is to help you enjoy the scenery,
but also understand why this place is so special.

I hope you leave Oku-Nikko
feeling a real connection to this place.`;

  const editScreen = document.getElementById('edit-screen');
  const prompterScreen = document.getElementById('prompter-screen');
  const scriptInput = document.getElementById('script-input');
  const startBtn = document.getElementById('start-btn');
  const backBtn = document.getElementById('back-btn');
  const scriptContent = document.getElementById('script-content');
  const emptyMessage = document.getElementById('empty-message');
  const countdownOverlay = document.getElementById('countdown-overlay');
  const scrollContainer = document.getElementById('scroll-container');
  const pauseZone = document.getElementById('pause-zone');
  const pauseIndicator = document.getElementById('pause-indicator');
  const restartBtn = document.getElementById('restart-btn');
  const speedUpBtn = document.getElementById('speed-up');
  const speedDownBtn = document.getElementById('speed-down');
  const speedValue = document.getElementById('speed-value');
  const speedSlider = document.getElementById('speed-slider');
  const nudgeBackBtn = document.getElementById('nudge-back');
  const nudgeForwardBtn = document.getElementById('nudge-forward');
  const markerLine = document.getElementById('marker-line');
  const progressDisplay = document.getElementById('progress-display');
  const fontSizeInput = document.getElementById('font-size-input');
  const fontSizeValue = document.getElementById('font-size-value');

  let countdownTimer = null;

  const state = { speed: 1.0, fontSize: 48, scrollY: 0, playing: false };

  const LS = { script: 'myprompter.script', speed: 'myprompter.speed', fontSize: 'myprompter.fontSize' };
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 保存不可環境では黙ってスキップ */ } }
  function saveScript() { lsSet(LS.script, scriptInput.value); }
  function saveSettings() { lsSet(LS.speed, String(state.speed)); lsSet(LS.fontSize, String(state.fontSize)); }
  function loadSettings() {
    const script = lsGet(LS.script);
    scriptInput.value = (script !== null && script !== '') ? script : DEFAULT_SCRIPT;
    const speed = parseFloat(lsGet(LS.speed));
    if (!isNaN(speed)) state.speed = Math.min(5.0, Math.max(0.5, speed));
    const fs = parseInt(lsGet(LS.fontSize), 10);
    if (!isNaN(fs)) state.fontSize = Math.min(96, Math.max(24, fs));
  }

  loadSettings();
  fontSizeInput.value = state.fontSize;
  fontSizeValue.textContent = state.fontSize + 'px';
  scriptContent.style.fontSize = state.fontSize + 'px';
  updateSpeedDisplay();

  let scriptSaveTimer = null;
  scriptInput.addEventListener('input', function () {
    clearTimeout(scriptSaveTimer);
    scriptSaveTimer = setTimeout(saveScript, 300);
  });

  // マーカー判定用：行のoffsetTopをrenderScript/文字サイズ変更のたびにキャッシュし、
  // 毎フレームのレイアウト読み取りを避ける
  let lineEls = [];
  let lineOffsets = [];
  let currentLineIndex = -1;
  let lastProgressTs = -Infinity;

  function cacheLineOffsets() {
    lineEls = Array.prototype.slice.call(scriptContent.querySelectorAll('.line'));
    lineEls.forEach(function (el) { el.classList.remove('current'); });
    lineOffsets = lineEls.map(function (el) { return el.offsetTop; });
    currentLineIndex = -1;
  }

  function showPauseIndicator() { pauseIndicator.classList.remove('hidden'); }
  function hidePauseIndicator() { pauseIndicator.classList.add('hidden'); }

  let lastTs = null;
  function pxPerSec() { return (state.fontSize * 1.3 / 6) * state.speed; }
  function maxScroll() {
    return Math.max(0, scriptContent.scrollHeight - scrollContainer.clientHeight);
  }
  function updateMarkerHighlight() {  // scrollYと各行のoffsetTop（キャッシュ済み）だけで判定。elementFromPointは使わない
    if (lineEls.length === 0) return;
    const markerContentY = state.scrollY + scrollContainer.clientHeight * 0.33;
    let lo = 0, hi = lineEls.length - 1, idx = 0;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (lineOffsets[mid] <= markerContentY) { idx = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    if (idx === currentLineIndex) return;
    if (currentLineIndex !== -1 && lineEls[currentLineIndex]) lineEls[currentLineIndex].classList.remove('current');
    lineEls[idx].classList.add('current');
    currentLineIndex = idx;
  }

  function updateProgress() {
    const total = maxScroll();
    const remainingSec = Math.max(0, (total - state.scrollY) / pxPerSec());
    const percent = total === 0 ? 100 : Math.round(state.scrollY / total * 100);
    const mm = Math.floor(remainingSec / 60);
    const ss = String(Math.floor(remainingSec % 60)).padStart(2, '0');
    progressDisplay.textContent = `残り ${mm}:${ss} ／ ${percent}%`;
  }

  function tick(ts) {
    if (!state.playing) return;
    if (lastTs !== null) {
      state.scrollY = Math.min(state.scrollY + pxPerSec() * (ts - lastTs) / 1000, maxScroll());
      scriptContent.style.transform = `translateY(${-state.scrollY}px)`;
      updateMarkerHighlight();
      if (ts - lastProgressTs >= 500) {
        updateProgress();
        lastProgressTs = ts;
      }
      if (state.scrollY >= maxScroll()) { pause(); showPauseIndicator(); }  // 末尾到達で自動停止
    }
    lastTs = ts;
    requestAnimationFrame(tick);
  }
  function play()  { if (state.playing) return; state.playing = true; lastTs = null; requestAnimationFrame(tick); }
  function pause() { state.playing = false; }
  function togglePlay() {
    if (countdownTimer !== null) return;  // カウントダウン中は無視（オーバーレイの裏で再生が始まるのを防ぐ）
    if (state.playing) { pause(); showPauseIndicator(); }
    else { play(); hidePauseIndicator(); }
  }
  function setSpeed(v) { state.speed = Math.min(5.0, Math.max(0.5, Math.round(v * 10) / 10)); }
  function updateSpeedDisplay() {
    speedValue.textContent = state.speed.toFixed(1) + 'x';
    speedSlider.value = state.speed;
  }
  function applySpeed(v) {  // setSpeedと表示更新をまとめて行う（ボタン・スライダー・キーボードすべてここを通す）
    setSpeed(v);
    updateSpeedDisplay();
    updateProgress();
    saveSettings();
  }
  function changeSpeed(delta) { applySpeed(state.speed + delta); }
  function nudge(lines) {  // 戻る=負、進む=正。1行 = fontSize*1.3px
    state.scrollY = Math.min(maxScroll(), Math.max(0, state.scrollY + lines * state.fontSize * 1.3));
    scriptContent.style.transform = `translateY(${-state.scrollY}px)`;
    updateMarkerHighlight();
    updateProgress();
  }
  function restart() {
    pause();
    hidePauseIndicator();
    state.scrollY = 0;
    scriptContent.style.transform = 'translateY(0)';
    updateMarkerHighlight();
    updateProgress();
    startCountdown();
  }

  function showEdit() {
    pause();
    hidePauseIndicator();
    clearInterval(countdownTimer);
    countdownTimer = null;
    countdownOverlay.classList.add('hidden');
    prompterScreen.classList.add('hidden');
    editScreen.classList.remove('hidden');
    releaseWakeLock();
  }

  function showPrompter() {
    state.scrollY = 0;
    scriptContent.style.transform = 'translateY(0)';
    editScreen.classList.add('hidden');
    prompterScreen.classList.remove('hidden');
    acquireWakeLock();
  }

  function renderScript(text) {
    scriptContent.innerHTML = '';
    const lines = text.split('\n');
    lines.forEach(function (line) {
      const div = document.createElement('div');
      if (line.trim() === '') {
        div.className = 'line blank';
        div.innerHTML = '&nbsp;';
      } else {
        div.className = 'line';
        div.textContent = line;
      }
      scriptContent.appendChild(div);
    });
    cacheLineOffsets();
  }

  function startCountdown() {
    clearInterval(countdownTimer);
    const counts = ['2', '1'];
    let i = 0;
    countdownOverlay.textContent = counts[i];
    countdownOverlay.classList.remove('hidden');
    countdownTimer = setInterval(function () {
      i++;
      if (i < counts.length) {
        countdownOverlay.textContent = counts[i];
      } else {
        clearInterval(countdownTimer);
        countdownTimer = null;
        countdownOverlay.classList.add('hidden');
        hidePauseIndicator();
        play();
      }
    }, 1000);
  }

  startBtn.addEventListener('click', function () {
    const text = scriptInput.value;
    showPrompter();
    if (text.trim() === '') {
      scriptContent.innerHTML = '';
      cacheLineOffsets();
      emptyMessage.classList.remove('hidden');
      updateProgress();
    } else {
      emptyMessage.classList.add('hidden');
      renderScript(text);
      updateMarkerHighlight();
      updateProgress();
      startCountdown();
    }
  });

  fontSizeInput.addEventListener('input', function () {
    state.fontSize = parseInt(fontSizeInput.value, 10);
    fontSizeValue.textContent = state.fontSize + 'px';
    scriptContent.style.fontSize = state.fontSize + 'px';
    cacheLineOffsets();  // 文字サイズ変更で行の高さ・offsetTopが変わるためキャッシュを作り直す
    saveSettings();
  });

  backBtn.addEventListener('click', function () {
    showEdit();
  });

  pauseZone.addEventListener('click', function () {
    togglePlay();
  });

  restartBtn.addEventListener('click', function () {
    restart();
  });

  nudgeBackBtn.addEventListener('click', function () {
    nudge(-1);
  });

  nudgeForwardBtn.addEventListener('click', function () {
    nudge(1);
  });

  // 長押しで連続変化するボタンの共通処理（250ms後から100ms間隔でfnを繰り返す）
  function bindHoldRepeat(el, fn) {
    let holdTimeout = null;
    let holdInterval = null;
    function clearHold() {
      clearTimeout(holdTimeout);
      clearInterval(holdInterval);
      holdTimeout = null;
      holdInterval = null;
    }
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      clearHold();  // 同一ボタンへの多重pointerdown（2本指タップ等）でタイマーがリークしないよう先にクリア
      fn();
      holdTimeout = setTimeout(function () {
        holdInterval = setInterval(fn, 100);
      }, 250);
    });
    el.addEventListener('pointerup', clearHold);
    el.addEventListener('pointerleave', clearHold);
    el.addEventListener('pointercancel', clearHold);
  }

  bindHoldRepeat(speedUpBtn, function () { changeSpeed(0.1); });
  bindHoldRepeat(speedDownBtn, function () { changeSpeed(-0.1); });

  speedSlider.addEventListener('input', function () {
    applySpeed(parseFloat(speedSlider.value));
  });

  document.addEventListener('keydown', function (e) {
    if (prompterScreen.classList.contains('hidden')) return;
    if (e.code === 'Space') {
      e.preventDefault();
      togglePlay();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      changeSpeed(0.1);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      changeSpeed(-0.1);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      restart();
    }
  });

  let wakeLock = null;
  async function acquireWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        const sentinel = await navigator.wakeLock.request('screen');
        // request解決前にshowEdit()が走っていた場合、このSentinelを保持せず即解放する
        // （そうしないとwakeLockに代入され、編集画面表示中もロックが保持され続ける）
        if (prompterScreen.classList.contains('hidden')) {
          sentinel.release().catch(() => {});
        } else {
          wakeLock = sentinel;
        }
      }
    } catch (e) { /* 非対応・拒否時は何もしない */ }
  }
  function releaseWakeLock() { if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !prompterScreen.classList.contains('hidden')) acquireWakeLock();
  });

  prompterScreen.addEventListener('dblclick', function (e) {
    e.preventDefault();
  });

  window.addEventListener('resize', function () {
    if (prompterScreen.classList.contains('hidden')) return;
    state.scrollY = Math.min(state.scrollY, maxScroll());
    scriptContent.style.transform = `translateY(${-state.scrollY}px)`;
    cacheLineOffsets();
    updateMarkerHighlight();
    updateProgress();
  });
</script>

</body>
</html>
